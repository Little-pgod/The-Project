<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Constelación</title>

    <link rel="icon" type="image/png" href="/assets/images/icon.png" />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.1/fonts/remixicon.min.css"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="estilos/space.css" />

    <script src="scripts/espacio.js" defer></script>
  </head>

  <body>
    <!-- Canvas fijo como fondo de pantalla completa -->
    <canvas id="starCanvasBg"></canvas>

    <!-- Botón de menú: esquina superior derecha -->
    <button class="music-btn" aria-label="Menú">
      <i class="ri-arrow-left-line"></i>
    </button>

    <main class="container">
      <!-- Encabezado centrado -->
      <header class="header">
        <h1 class="title">Eres mi universo</h1>
        <p class="subtitle">
          En ti está mi universo, y no puedo explicar tal fascinación que tengo por ti
        </p>
      </header>

      <!-- Zona de constelación -->
      <div class="constellation">
        <canvas id="starCanvas"></canvas>
      </div>
    </main>
  </body>
</html>
