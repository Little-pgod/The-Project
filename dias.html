<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos</title>
    <!-- Estilos -->
    <link rel="stylesheet" href="estilos/days.css">
    <style>
      .tree-container {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 400px;
        height: 400px;
        z-index: 2;
      }
      .animated-heart {
        transform-origin: center;
        animation: beat 1s infinite;
      }
      @keyframes beat {
        0%, 100% { transform: scale(1); }
        20% { transform: scale(1.1); }
        40% { transform: scale(0.95); }
        60% { transform: scale(1.08); }
        80% { transform: scale(1); }
      }
    </style>
</head>
<body>
    <div id="floating-objects"></div>
    <div class="dedication-text" id="dedication-text">
      <div class="signature" id="signature"></div>
    </div>
    <div class="tree-container" id="tree-container"></div>
    <div class="countdown-wrapper">
      <div class="countdown" id="countdown"></div>
      <div class="moment-nav">
        <button class="nav-btn prev-btn" id="prev-btn">← Anterior</button>
        <span class="moment-indicator" id="moment-indicator">1 / 3</span>
        <button class="nav-btn next-btn" id="next-btn">Siguiente →</button>
      </div>
    </div>
    <audio src="musica/musicdays.mp3" id="bg-music" preload="auto"></audio>
    <script src="scripts/dias.js"></script>
</body>
</html>
