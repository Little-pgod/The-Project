<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi Amor</title>

    <!-- CSS -->
    <link rel="stylesheet" href="estilos/base.css">
    <link rel="stylesheet" href="estilos/index.css">
    <link rel="stylesheet" href="estilos/bloqueo.css">

</head>
<body class="pantalla-inicio">

        <!-- BLOQUEO -->
    <div id="bloqueo" class="bloqueo">

        <div class="ventana-bloqueo">
            <h2>REPERTORIO SUSPENDIDO</h2>

            <p>
                El acceso se encuentra deshabilitado.<br>
                Si necesitas ingresar, contacta al administrador.
            </p>

            <input
                type="password"
                id="codigo"
                placeholder="Código de acceso"
                autocomplete="off">

            <button id="btnCodigo">
                Desbloquear
            </button>

            <p id="mensaje"></p>
        </div>

    </div>

    <!-- CONTENEDOR -->
    <div class="contenedor-inicio">

        <!-- MARCO DE FONDO -->
        <img src="imagenes/corazonflor.png" class="portada-fondo">

        <!-- CONTENEDOR DE CONTENIDO -->
        <div class="contenedor-contenido">
            <!-- TITULO -->
            <h1 class="titulo">AMOR,</h1>

            <!-- SUBTITULO -->
            <p class="subtitulo">
                TE QUIERO DECIR ALGO <br>
                MUY IMPORTANTE.
            </p>

            <!-- BOTON -->
            <img src="imagenes/boton.png" id="btnEntrar">
        </div>

    </div>

    <script src="scripts/bloqueo.js"></script>
    <script src="scripts/script.js"></script>

</body>
